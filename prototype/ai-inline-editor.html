<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Inline Editor · 原型</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-body: #F9F9F7;
      --bg-editor: #FFFFFF;
      --bg-toolbar: rgba(255,255,255,0.92);
      --bg-diff-removed: #FEE2E2;
      --bg-diff-added: #DCFCE7;
      --bg-hover: #F3F4F6;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --accent: #4F46E5;
      --accent-hover: #4338CA;
      --accent-light: #EEF2FF;
      --danger: #DC2626;
      --success: #16A34A;
      --border: #E5E7EB;
      --border-light: #F3F4F6;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.04);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Noto Serif SC', 'Georgia', serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.65;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 顶部导航 ===== */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 52px;
      background: rgba(249,249,247,0.85);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .doc-title {
      font-size: 14px; font-weight: 500; color: var(--text-primary);
      display: flex; align-items: center; gap: 8px;
    }
    .doc-title .status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--success);
      box-shadow: 0 0 0 2px rgba(22,163,74,0.15);
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .btn {
      padding: 6px 14px; border-radius: var(--radius-sm); font-size: 13px;
      font-weight: 500; border: none; cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
    .btn-primary {
      background: var(--accent); color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ===== 编辑器布局 ===== */
    .editor-shell {
      max-width: 780px;
      margin: 0 auto;
      padding: 88px 48px 120px;
    }

    /* ===== 文档元信息 ===== */
    .doc-meta {
      margin-bottom: 48px;
    }
    .doc-meta h1 {
      font-family: var(--font-serif);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .doc-meta .meta-line {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: var(--text-muted);
    }
    .meta-line .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #818CF8);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; color: white; font-weight: 600;
    }

    /* ===== 段落样式 ===== */
    .paragraph {
      font-size: 16.5px;
      line-height: 1.8;
      color: var(--text-primary);
      margin-bottom: 1.2em;
      position: relative;
      transition: background 0.2s;
    }
    .paragraph:hover {
      background: linear-gradient(90deg, rgba(79,70,229,0.02) 0%, transparent 8%);
    }
    .paragraph strong {
      font-weight: 600;
      color: #111827;
    }

    /* ===== 选中高亮 ===== */
    ::selection {
      background: rgba(79,70,229,0.18);
      color: inherit;
    }

    /* ===== 浮动工具栏 ===== */
    .floating-toolbar {
      position: absolute;
      z-index: 100;
      background: var(--bg-toolbar);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 6px;
      display: flex; align-items: center; gap: 2px;
      animation: toolbar-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center bottom;
    }
    @keyframes toolbar-in {
      from { opacity: 0; transform: translateY(6px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toolbar-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: none; background: transparent;
      font-size: 13px; font-weight: 500; color: var(--text-primary);
      cursor: pointer; transition: all 0.12s;
      font-family: inherit; white-space: nowrap;
    }
    .toolbar-btn:hover { background: var(--bg-hover); }
    .toolbar-btn .icon { width: 15px; height: 15px; opacity: 0.7; }
    .toolbar-btn-primary {
      background: var(--accent); color: white;
    }
    .toolbar-btn-primary:hover { background: var(--accent-hover); }
    .toolbar-btn-primary .icon { opacity: 1; }

    .toolbar-divider {
      width: 1px; height: 20px; background: var(--border);
      margin: 0 2px;
    }

    /* ===== AI 输入框 ===== */
    .ai-input-popover {
      position: absolute;
      z-index: 100;
      width: 320px;
      background: var(--bg-toolbar);
      backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 14px;
      animation: toolbar-in 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ai-input-popover input {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
      background: var(--bg-editor);
    }
    .ai-input-popover input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
    }
    .ai-input-popover .hint {
      font-size: 11px; color: var(--text-muted);
      margin-top: 8px; display: flex; justify-content: space-between;
    }

    /* ===== Inline Diff ===== */
    .diff-block {
      position: relative;
      margin: 8px 0;
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .diff-actions {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 4px;
      opacity: 0; transition: opacity 0.2s;
      z-index: 5;
    }
    .diff-block:hover .diff-actions { opacity: 1; }

    .diff-removed {
      background: var(--bg-diff-removed);
      text-decoration: line-through;
      color: #991B1B;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .diff-added {
      background: var(--bg-diff-added);
      color: #166534;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: 500;
    }

    .diff-row {
      display: flex; align-items: flex-start;
      padding: 10px 14px;
      border-left: 3px solid transparent;
      transition: background 0.15s;
    }
    .diff-row:hover { background: rgba(0,0,0,0.015); }
    .diff-row.removed { border-left-color: var(--danger); background: var(--bg-diff-removed); }
    .diff-row.added { border-left-color: var(--success); background: var(--bg-diff-added); }

    .diff-row .row-marker {
      width: 20px; flex-shrink: 0;
      font-size: 13px; font-weight: 600;
      margin-right: 8px; margin-top: 1px;
    }
    .diff-row.removed .row-marker { color: var(--danger); }
    .diff-row.added .row-marker { color: var(--success); }

    .diff-row .row-content {
      flex: 1; font-size: 15px; line-height: 1.65;
    }

    /* Diff 行内操作按钮 */
    .row-actions {
      display: flex; gap: 4px;
      margin-left: 8px; opacity: 0;
      transition: opacity 0.2s;
    }
    .diff-row:hover .row-actions { opacity: 1; }
    .row-action-btn {
      width: 26px; height: 26px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px; color: var(--text-secondary);
      transition: all 0.12s;
    }
    .row-action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .row-action-btn.reject:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--bg-diff-removed);
    }

    /* ===== 加载动画 ===== */
    .ai-loading {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px;
      background: var(--accent-light);
      border-radius: var(--radius-md);
      border: 1px solid rgba(79,70,229,0.08);
      margin: 8px 0;
    }
    .ai-loading .dots {
      display: flex; gap: 3px;
    }
    .ai-loading .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      animation: dot-bounce 1.4s ease-in-out infinite;
    }
    .ai-loading .dot:nth-child(2) { animation-delay: 0.15s; }
    .ai-loading .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }
    .ai-loading span {
      font-size: 13px; color: var(--accent); font-weight: 500;
    }

    /* ===== 右侧面板（上下文） ===== */
    .sidebar-hint {
      position: fixed; right: 24px; top: 72px;
      width: 220px;
    }
    .hint-card {
      background: var(--bg-editor);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }
    .hint-card h4 {
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .hint-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .hint-item kbd {
      background: var(--bg-body); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 6px;
      font-size: 11px; font-family: monospace;
      color: var(--text-primary);
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--text-primary); color: white;
      padding: 10px 20px; border-radius: var(--radius-md);
      font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: toast-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ===== 空选择提示 ===== */
    .empty-hint {
      text-align: center; padding: 80px 40px;
      color: var(--text-muted);
    }
    .empty-hint p { font-size: 15px; margin-bottom: 8px; }
    .empty-hint .sub { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ===== 图标组件 =====
    const SparkleIcon = () => (
      <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6Z"/>
      </svg>
    );
    const WandIcon = () => (
      <svg className="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="M9 13l6 6"/>
        <path d="M15 13l-6 6"/>
      </svg>
    );
    const CheckIcon = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );
    const XIcon = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    );
    const ChevronRight = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    );

    // ===== 模拟文档数据 =====
    const INITIAL_DOC = [
      { id: 'p1', text: '智能客服系统旨在通过自然语言处理技术，帮助企业自动化处理客户咨询。系统核心模块包括意图识别、多轮对话管理、知识库检索以及情感分析。' },
      { id: 'p2', text: '目前系统在处理复杂多轮对话时存在上下文丢失的问题，导致用户体验不够流畅。我们计划在下一版本中引入记忆网络机制，提升长对话的连贯性。' },
      { id: 'p3', text: '此外，知识库的答案质量直接决定了客服系统的可用性。现有的关键词匹配方案召回率较高，但精确率偏低，经常返回不相关的答案给用户。' },
      { id: 'p4', text: '我们的目标是在本季度末将首次响应时间缩短至 2 秒以内，同时将用户满意度从现有的 72% 提升至 85% 以上。' },
    ];

    // ===== AI 改写模拟数据 =====
    const AI_SUGGESTIONS = {
      improve: {
        p1: [
          { type: 'removed', text: '旨在通过自然语言处理技术，帮助企业自动化处理客户咨询。系统核心模块包括意图识别、多轮对话管理、知识库检索以及情感分析。' },
          { type: 'added', text: '基于自然语言处理技术，实现客户咨询的自动化响应。核心能力涵盖：意图识别、多轮对话管理、知识库检索与情感分析。' },
        ],
        p2: [
          { type: 'removed', text: '目前系统在处理复杂多轮对话时存在上下文丢失的问题，导致用户体验不够流畅。我们计划在下一版本中引入记忆网络机制，提升长对话的连贯性。' },
          { type: 'added', text: '复杂多轮对话中的上下文丢失问题，是影响用户体验的关键瓶颈。下一版本将引入记忆网络机制，显著改善长对话的连贯性与一致性。' },
        ],
      },
      shorten: {
        p1: [
          { type: 'removed', text: '智能客服系统旨在通过自然语言处理技术，帮助企业自动化处理客户咨询。系统核心模块包括意图识别、多轮对话管理、知识库检索以及情感分析。' },
          { type: 'added', text: '智能客服系统基于 NLP 技术，自动化处理客户咨询。核心模块：意图识别、对话管理、知识库检索、情感分析。' },
        ],
      },
      longer: {
        p3: [
          { type: 'removed', text: '此外，知识库的答案质量直接决定了客服系统的可用性。现有的关键词匹配方案召回率较高，但精确率偏低，经常返回不相关的答案给用户。' },
          { type: 'added', text: '此外，知识库的答案质量直接决定了客服系统的可用性与用户信任度。当前采用的关键词匹配方案虽然具备较高的召回率，但在精确率方面表现不佳，频繁向用户返回不相关或低质量的答案，这在一定程度上损害了用户体验，也成为满意度提升的主要障碍之一。' },
        ],
      },
    };

    // ===== 组件：浮动工具栏 =====
    function FloatingToolbar({ rect, onAction, onAsk }) {
      const toolbarRef = useRef(null);
      const [style, setStyle] = useState({});

      useEffect(() => {
        if (!toolbarRef.current || !rect) return;
        const tb = toolbarRef.current;
        const tbRect = tb.getBoundingClientRect();
        let left = rect.left + (rect.width - tbRect.width) / 2;
        let top = rect.top - tbRect.height - 12;
        if (left < 12) left = 12;
        if (left + tbRect.width > window.innerWidth - 12) {
          left = window.innerWidth - tbRect.width - 12;
        }
        if (top < 12) top = rect.bottom + 12;
        setStyle({ left, top });
      }, [rect]);

      return (
        <div ref={toolbarRef} className="floating-toolbar" style={style}>
          <button className="toolbar-btn toolbar-btn-primary" onClick={() => onAction('improve')}>
            <SparkleIcon />
            优化表达
          </button>
          <div className="toolbar-divider" />
          <button className="toolbar-btn" onClick={() => onAction('shorten')}>
            精简
          </button>
          <button className="toolbar-btn" onClick={() => onAction('longer')}>
            扩写
          </button>
          <div className="toolbar-divider" />
          <button className="toolbar-btn" onClick={onAsk}>
            <WandIcon />
            自定义
          </button>
        </div>
      );
    }

    // ===== 组件：AI 输入框 =====
    function AIInputPopover({ rect, onSubmit, onCancel }) {
      const [value, setValue] = useState('');
      const popoverRef = useRef(null);
      const [style, setStyle] = useState({});
      const inputRef = useRef(null);

      useEffect(() => {
        if (!popoverRef.current || !rect) return;
        const pb = popoverRef.current;
        const pbRect = pb.getBoundingClientRect();
        let left = rect.left + (rect.width - pbRect.width) / 2;
        let top = rect.top - pbRect.height - 12;
        if (left < 12) left = 12;
        if (left + pbRect.width > window.innerWidth - 12) {
          left = window.innerWidth - pbRect.width - 12;
        }
        if (top < 12) top = rect.bottom + 12;
        setStyle({ left, top });
        setTimeout(() => inputRef.current?.focus(), 50);
      }, [rect]);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') { onSubmit(value); }
        if (e.key === 'Escape') { onCancel(); }
      };

      return (
        <div ref={popoverRef} className="ai-input-popover" style={style}>
          <input
            ref={inputRef}
            type="text"
            placeholder="告诉 AI 如何改写..."
            value={value}
            onChange={e => setValue(e.target.value)}
            onKeyDown={handleKeyDown}
          />
          <div className="hint">
            <span>按 Enter 发送，Esc 取消</span>
            <span style={{ color: 'var(--accent)' }}>{value.length}</span>
          </div>
        </div>
      );
    }

    // ===== 组件：Diff 视图 =====
    function DiffView({ diffs, onAccept, onReject, blockId }) {
      return (
        <div className="diff-block">
          {diffs.map((diff, i) => (
            <div key={i} className={`diff-row ${diff.type}`}>
              <div className="row-marker">{diff.type === 'removed' ? '−' : '+'}</div>
              <div className="row-content">{diff.text}</div>
              <div className="row-actions">
                <button className="row-action-btn" onClick={() => onAccept(blockId)} title="接受">
                  <CheckIcon />
                </button>
                <button className="row-action-btn reject" onClick={() => onReject(blockId)} title="拒绝">
                  <XIcon />
                </button>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ===== 组件：加载指示器 =====
    function AILoading() {
      return (
        <div className="ai-loading">
          <div className="dots">
            <div className="dot" />
            <div className="dot" />
            <div className="dot" />
          </div>
          <span>AI 正在改写...</span>
        </div>
      );
    }

    // ===== 组件：Toast =====
    function Toast({ message, onDone }) {
      useEffect(() => {
        const t = setTimeout(onDone, 2200);
        return () => clearTimeout(t);
      }, [onDone]);
      return <div className="toast">{message}</div>;
    }

    // ===== 主应用 =====
    function App() {
      const [doc, setDoc] = useState(INITIAL_DOC);
      const [selection, setSelection] = useState(null);
      const [toolbarRect, setToolbarRect] = useState(null);
      const [showAIInput, setShowAIInput] = useState(false);
      const [loadingBlock, setLoadingBlock] = useState(null);
      const [diffs, setDiffs] = useState({}); // { blockId: [{type, text}] }
      const [toast, setToast] = useState(null);
      const editorRef = useRef(null);

      // 监听文本选择
      useEffect(() => {
        const handleSelection = () => {
          const sel = window.getSelection();
          if (!sel || sel.isCollapsed || !sel.toString().trim()) {
            setSelection(null);
            setToolbarRect(null);
            setShowAIInput(false);
            return;
          }
          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          setSelection({ text: sel.toString(), range });
          setToolbarRect(rect);
          setShowAIInput(false);
        };

        document.addEventListener('selectionchange', handleSelection);
        return () => document.removeEventListener('selectionchange', handleSelection);
      }, []);

      // 点击外部取消选择
      useEffect(() => {
        const handleClick = (e) => {
          if (e.target.closest('.floating-toolbar') || e.target.closest('.ai-input-popover')) return;
          if (e.target.closest('.diff-block')) return;
          const sel = window.getSelection();
          if (sel) sel.removeAllRanges();
          setSelection(null);
          setToolbarRect(null);
          setShowAIInput(false);
        };
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, []);

      const handleAction = useCallback((action) => {
        if (!selection) return;
        // 找出选中的段落
        const selectedText = selection.text;
        let targetBlock = null;
        for (const block of doc) {
          if (block.text.includes(selectedText)) {
            targetBlock = block;
            break;
          }
        }
        if (!targetBlock) {
          setToast('请完整选择某一个段落');
          return;
        }

        setToolbarRect(null);
        setShowAIInput(false);
        setLoadingBlock(targetBlock.id);

        // 模拟 AI 延迟
        setTimeout(() => {
          const suggestion = AI_SUGGESTIONS[action]?.[targetBlock.id];
          if (suggestion) {
            setDiffs(prev => ({ ...prev, [targetBlock.id]: suggestion }));
          } else {
            //  fallback: 生成一个通用的 diff
            const words = targetBlock.text.split('');
            const mid = Math.floor(words.length / 2);
            const fallback = [
              { type: 'removed', text: targetBlock.text },
              { type: 'added', text: `[已${action === 'improve' ? '优化' : action === 'shorten' ? '精简' : '扩写'}] ${targetBlock.text}` },
            ];
            setDiffs(prev => ({ ...prev, [targetBlock.id]: fallback }));
          }
          setLoadingBlock(null);
        }, 1200 + Math.random() * 800);
      }, [selection, doc]);

      const handleAskSubmit = useCallback((prompt) => {
        if (!prompt.trim()) return;
        handleAction('improve');
      }, [handleAction]);

      const handleAccept = useCallback((blockId) => {
        const diff = diffs[blockId];
        if (!diff) return;
        const added = diff.filter(d => d.type === 'added').map(d => d.text).join('');
        setDoc(prev => prev.map(b => b.id === blockId ? { ...b, text: added || b.text } : b));
        setDiffs(prev => { const n = { ...prev }; delete n[blockId]; return n; });
        setToast('已应用修改');
      }, [diffs]);

      const handleReject = useCallback((blockId) => {
        setDiffs(prev => { const n = { ...prev }; delete n[blockId]; return n; });
        setToast('已忽略修改');
      }, []);

      return (
        <>
          {/* 顶部导航 */}
          <div className="topbar">
            <div className="topbar-left">
              <div className="doc-title">
                <span className="status-dot" />
                产品需求文档：智能客服系统
              </div>
            </div>
            <div className="topbar-actions">
              <button className="btn btn-ghost">分享</button>
              <button className="btn btn-primary">
                <SparkleIcon /> AI 助手
              </button>
            </div>
          </div>

          {/* 编辑器主体 */}
          <div className="editor-shell" ref={editorRef}>
            <div className="doc-meta">
              <h1>产品需求文档：智能客服系统</h1>
              <div className="meta-line">
                <span className="avatar">AI</span>
                <span>最后编辑于 2 分钟前</span>
              </div>
            </div>

            {doc.map((block) => (
              <div key={block.id}>
                {loadingBlock === block.id ? (
                  <AILoading />
                ) : diffs[block.id] ? (
                  <DiffView
                    diffs={diffs[block.id]}
                    blockId={block.id}
                    onAccept={handleAccept}
                    onReject={handleReject}
                  />
                ) : (
                  <div className="paragraph" data-block-id={block.id}>
                    {block.text}
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* 浮动工具栏 */}
          {toolbarRect && !showAIInput && !loadingBlock && (
            <FloatingToolbar
              rect={toolbarRect}
              onAction={handleAction}
              onAsk={() => { setShowAIInput(true); }}
            />
          )}

          {/* AI 自定义输入 */}
          {showAIInput && toolbarRect && (
            <AIInputPopover
              rect={toolbarRect}
              onSubmit={handleAskSubmit}
              onCancel={() => setShowAIInput(false)}
            />
          )}

          {/* 右侧提示 */}
          <div className="sidebar-hint">
            <div className="hint-card">
              <h4>快捷操作</h4>
              <div className="hint-item">
                <kbd>⌘</kbd> + <kbd>K</kbd>
                <span>唤起 AI</span>
              </div>
              <div className="hint-item">
                <span>选中文本</span>
                <ChevronRight />
                <span>查看工具栏</span>
              </div>
              <div className="hint-item">
                <span>悬停 diff</span>
                <ChevronRight />
                <span>接受 / 拒绝</span>
              </div>
            </div>
          </div>

          {/* Toast */}
          {toast && <Toast message={toast} onDone={() => setToast(null)} />}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
